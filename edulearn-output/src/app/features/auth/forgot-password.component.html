<div class="auth-page">
  <div class="auth-shell">
    <section class="brand-panel">
      <div class="brand-content">
        <h1>Learn smarter, stay consistent, and progress in one place.</h1>
      </div>

      <div class="brand-illustration-wrap">
        <img src="assets/edulearn-pana.png" alt="EduLearn illustration" class="brand-illustration" />
      </div>
    </section>

    <section class="form-panel">
      <div class="form-card">
        <div class="form-header">
          <div class="brand-top">
            <div class="brand-logo-card">
              <img src="assets/edulearn-logo.png" alt="EduLearn visual" class="brand-logo" />
            </div>
          </div>

          <h2>Forgot Password</h2>
          <p>Enter your registered email to receive a password reset link.</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="field-group">
            <label>Email</label>
            <input type="email" formControlName="email" placeholder="Enter your registered email" />
            <small class="error" *ngIf="emailError()">{{ emailError() }}</small>
          </div>

          <button class="primary-btn" type="submit" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Sending reset link...' : 'Send Reset Link' }}
          </button>

          <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>
          <p class="error api-error" *ngIf="apiError()">{{ apiError() }}</p>

          <div class="form-footer">
            Remembered your password?
            <a routerLink="/login">Back to login</a>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>
